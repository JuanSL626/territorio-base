# Override de DESARROLLO. Compose lo aplica solo, encima de `compose.yaml`,
# cuando existe y no se pasa `-f` explícito. Es decir:
#
#     docker compose up            → compose.yaml + este archivo (desarrollo)
#     docker compose -f compose.yaml up   → solo compose.yaml (producción)
#
# Lo que cambia acá gana el derecho a existir por una razón concreta cada uno.
# Si algún día no queda ninguna, borrar el archivo entero es la respuesta
# correcta: un override que solo repite el base es ruido que se desincroniza.

services:
  # ───────────────────────────────────────────────────────────────────────────
  # api — recarga en caliente sobre el código del host.
  #
  # El caso real: iterar sobre el pipeline raster sin reconstruir una imagen que
  # instala rasterio, GDAL y odc-stac. `src/` se monta desde el host y uvicorn
  # levanta con `--reload`. El `.venv` NO se monta — es el de la imagen, con las
  # wheels de Linux; pisarlo con el `.venv` de macOS del host rompe rasterio.
  # ───────────────────────────────────────────────────────────────────────────
  api:
    build:
      target: runtime
    volumes:
      - ./services/api/src:/app/src:ro
    environment:
      TERRITORIO_DEBUG: "1"
      # Vite dev sirve en 3000; el SSR de compose también. Los dos permitidos
      # para poder mezclar `pnpm dev` local contra el `api` del contenedor.
      TERRITORIO_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    command:
      - uvicorn
      - territorio_base_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --reload
      - --reload-dir
      - /app/src

  # ───────────────────────────────────────────────────────────────────────────
  # web — nada de hot reload acá, y es deliberado.
  #
  # El desarrollo de la app web se hace con `pnpm dev` en el host: es más rápido
  # (HMR de Vite, sin capa de filesystem de Docker) y es el flujo que documenta
  # el README. Lo único que cambia es apagar `read_only`, porque un contenedor
  # de sólo lectura vuelve indescifrable cualquier error de escritura mientras
  # se está depurando.
  # ───────────────────────────────────────────────────────────────────────────
  web:
    read_only: false
