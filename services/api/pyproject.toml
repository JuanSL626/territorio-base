[project]
name = "territorio-base-api"
version = "0.2.0"
description = "Servicio raster de Territorio Base: STAC/Planetary Computer, NDVI, pendiente, WorldCover, Aqueduct y export GeoTIFF."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- Servicio HTTP ---
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.13.4",
    "sse-starlette>=3.0.0",
    # --- Motor raster (el único motivo por el que este servicio existe) ---
    "odc-stac>=0.5.3",
    "planetary-computer>=1.0.0",
    "pystac-client>=0.9.0",
    "rasterio>=1.4.4",
    "rioxarray>=0.19.0",
    "xarray>=2026.7.0",
    "numpy>=2.4.6",
    "pyproj>=3.7.2",
    "shapely>=2.1.2",
    "requests>=2.34.2",
    # --- Render de overlays ---
    # matplotlib se usa SOLO por sus colormaps (terrain, YlOrRd, RdYlGn, Blues), que
    # son las mismas que usaba el mapa folium legacy: cambiarlas rompería la paridad
    # visual con los reportes ya emitidos. El PNG lo escribe Pillow.
    "matplotlib>=3.11.1",
    "pillow>=12.3.0",
]

# Salieron a propósito (el servicio ya no las usa):
#   streamlit, streamlit-folium, folium -> la UI es TanStack Start + MapLibre.
#   geopandas, pyogrio                  -> lo vectorial y el parseo de AOI son de
#                                          packages/geo (TypeScript). aoi.py ahora
#                                          usa shapely + pyproj, que rasterio ya trae.

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    # starlette 1.6 deprecó httpx para TestClient y pide httpx2.
    "httpx2>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "territorio_base_api"

[tool.ruff]
# Un solo linter para todo el Python del repo. Corre en CI (`ruff check`) y en
# local (`uvx ruff check services/api`).
target-version = "py311"
line-length = 100
# `legacy-vector-reference/` es el código Streamlit anterior, guardado a
# propósito como referencia numérica mientras se verifica la paridad del port
# vectorial a `packages/geo`. No se ejecuta, no se despliega y no se arregla:
# lintearlo sería pedir cambios sobre un fósil.
extend-exclude = ["legacy-vector-reference"]

[tool.ruff.lint]
# ── Por qué este conjunto y no uno más ambicioso ────────────────────────────
# Es el set por defecto de ruff (E4 imports, E7 sintaxis, E9 errores, F
# pyflakes) más W. Es exactamente lo que el código pasa HOY, verificado
# corriéndolo, y una regla que el repo no cumple es una regla apagada: o rompe
# CI, o se ignora, y las dos cosas son peores que no tenerla.
#
# Para ampliarlo, el camino es medible y en este orden (errores actuales, con
# `--line-length 100`, medidos el 2026-08-28):
#     + "I"                → 9  (orden de imports, todos en tests/, --fix los arregla)
#     + "UP","B","C4"      → 19
#     + "E" completo (E501) → 21 (líneas largas)
# Cada paso: `uvx ruff check --select <set> --fix services/api`, revisar el
# diff, sumar la letra acá. No sumarla antes de que el árbol esté limpio.
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.isort]
known-first-party = ["territorio_base_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: golpea servicios externos reales (Planetary Computer, WRI). Se excluye en CI con `-m 'not network'`.",
    "slow: tarda más de ~10 s.",
]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
    # odc-loader llama a rasterio.warp.reproject con un ndarray de destino desnudo
    # (el geobox va por dst_transform/dst_crs). rasterio avisa igual. Es ruido de la
    # librería, no un geotransform perdido nuestro: verificado siguiendo el stack.
    "ignore:Dataset has no geotransform:rasterio.errors.NotGeoreferencedWarning",
]
