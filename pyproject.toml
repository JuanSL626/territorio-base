[project]
name = "territorio-base"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.4",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "odc-stac>=0.5.3",
    "planetary-computer>=1.0.0",
    "pyogrio>=0.13.0",
    "pyproj>=3.7.2",
    "pystac-client>=0.9.0",
    "rasterio>=1.4.4",
    "requests>=2.34.2",
    "rioxarray>=0.19.0",
    "shapely>=2.1.2",
    "streamlit>=1.62.0",
    "streamlit-folium>=0.27.4",
    "xarray>=2026.7.0",
]

[project.scripts]
territorio-base = "territorio_base:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
