# CI de Territorio Base.
#
# Tres trabajos independientes, uno por tecnología, que corren en paralelo:
#
#   node    → pnpm + turbo: lint, typecheck, test, build de todo el workspace TS
#   python  → uv + ruff + pytest del servicio raster
#   docker  → construye las DOS imágenes (sin push) y valida compose
#
# No hay `needs:` entre ellos a propósito: son fallas distintas y quien abre el
# PR quiere ver las tres a la vez, no la primera y después la segunda.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Un push nuevo sobre la misma rama cancela el run anterior. En un repo con
# turbo remote cache esto además evita que dos runs se peleen por escribir.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Sin colores ANSI en los logs de Actions.
  FORCE_COLOR: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  # Node — todo el workspace TypeScript
  node:
    name: Node · lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `packages/db` corre sus tests contra Postgres real, no `:memory:` (no
    # hay equivalente con Supabase — `docs/supabase/03-datos-migracion.md`
    # §4). `services:` en vez de `docker compose up`: Actions lo arranca y
    # espera el healthcheck antes del primer step. `postgres:17`, no
    # `17-alpine`: coincide con `major_version` de `supabase/config.toml`
    # (la misma mayor que Supabase Cloud, que es lo único que hace falta
    # para que las migraciones se comporten igual) y está cacheada de otros
    # workflows. No es el stack completo de `supabase start`: Auth/Storage/
    # Studio no hacen falta para testear `packages/db`, y bajar esas
    # imágenes en cada run sería más lento sin cubrir nada extra.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Caché remota de Turborepo: opt-in y sin romperse si no está
      # configurada (si los secrets no existen, turbo cae a la caché local).
      # Para activarla, definir los secrets TURBO_TOKEN y la variable
      # TURBO_TEAM (Vercel Remote Cache o un self-hosted compatible).
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_API: ${{ vars.TURBO_API }}
      # Etiqueta los artefactos por rama: main puede leer y escribir, un PR sólo
      # debería leer lo que main dejó.
      TURBO_REMOTE_ONLY: "false"
      # `rate-limit.test.ts` (packages/db) lee esta primero, con `DATABASE_URL`
      # como fallback — separada a propósito para apuntar los tests a una
      # base disponible sin pisar la que usaría la app. Rol `postgres`/
      # contraseña `postgres`: credenciales de arranque del contenedor
      # `services.postgres` de arriba, no un secreto real.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      # Que las migraciones de `supabase/migrations/` apliquen limpio contra
      # un Postgres 17 recién creado, antes de gastar tiempo en pnpm/turbo —
      # para fallar rápido. NO usa el CLI de Supabase (`supabase start`/
      # `db reset`): levanta su stack completo (Auth/Storage/Studio/Kong,
      # media docena de imágenes) solo para esto, más lento en un runner
      # efímero sin esas imágenes cacheadas; un `psql` directo contra
      # `services.postgres` de arriba alcanza
      # (`docs/supabase/03-datos-migracion.md` §4).
      #
      # Este Postgres "de verdad" no alcanza tal cual porque la migración
      # trae `analysis.user_id REFERENCES auth.users(id)` — `auth.users` no
      # existe hasta que GoTrue la crea. No se emula GoTrue: alcanza con la
      # forma mínima que la FK necesita (una columna `id uuid`).
      #
      # `ON_ERROR_STOP=1` hace que un archivo con SQL inválido tumbe el step
      # en vez de seguir con un exit code 0 engañoso.
      - name: Instalar cliente de Postgres
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Validar migraciones de Supabase desde cero
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create schema if not exists auth; create table if not exists auth.users (id uuid primary key);'
          for f in supabase/migrations/*.sql; do
            echo "Aplicando $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done

      # `packageManager` del package.json raíz fija la versión exacta de pnpm.
      # Nunca se escribe un número acá: si el equipo sube pnpm, CI lo sigue solo.
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          # Fuente única: `.nvmrc`. La misma versión que la imagen Docker.
          node-version-file: .nvmrc
          # Cachea el store de pnpm con clave sobre pnpm-lock.yaml.
          cache: pnpm

      # `--frozen-lockfile` es el punto del trabajo: si alguien tocó un
      # package.json sin regenerar el lockfile, CI falla acá y no tres pasos
      # más adelante con una versión distinta a la de su máquina.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Caché de los artefactos locales de turbo, para las tareas que la caché
      # remota no cubra (o cuando no está configurada).
      - name: Caché de Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Una sola invocación: turbo resuelve el grafo (`lint`/`typecheck`/
      # `test` dependen de `^build`) y paraleliza — cuatro pasos separados
      # repetirían los builds de las dependencias cuatro veces.
      #
      # `--filter=!@territorio/api-service` es obligatorio: `services/api`
      # tiene package.json (entra al workspace pnpm y al grafo de turbo) pero
      # es el servicio Python — su `test` es `uv run pytest`, y este job no
      # tiene uv. Sin el filtro, turbo lo ejecuta, falla con ELIFECYCLE y
      # cancela las tareas hermanas en vuelo. Ese paquete lo prueba el job
      # `Python · ruff · pytest`, que sí instala uv.
      #
      # No se reproduce en local (ahí uv está instalado, así que `pnpm test`
      # pasa y CI falla) — motivo de la divergencia si algún día se quiere
      # correr todo junto en local.
      - name: lint · typecheck · test · build
        run: pnpm exec turbo run lint typecheck test build --filter='!@territorio/api-service'

      # Guardarraíl del despliegue, no del código: el Dockerfile de la web
      # copia `apps/web/server.mjs` y arranca `node server.mjs`. Si alguien lo
      # borra o lo renombra, la imagen se construye igual y el contenedor muere
      # al arrancar. Que falle acá, en 200 ms.
      - name: Verificar el entrypoint de producción
        run: node --check apps/web/server.mjs

  # Python — services/api
  python:
    name: Python · ruff · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          # Cachea ~/.cache/uv con clave sobre el lockfile del servicio.
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      # `--frozen` = el equivalente de `--frozen-lockfile`: falla si
      # pyproject.toml y uv.lock divergieron, en vez de resolver de nuevo en
      # silencio y testear contra versiones que nadie desplegó.
      - name: Instalar dependencias
        run: uv sync --frozen

      # ruff se ejecuta con `uvx` y versión fija: NO está en el grupo `dev` del
      # proyecto a propósito, para no meter una herramienta de CI en el árbol de
      # dependencias que se resuelve para la imagen. La configuración
      # (reglas, exclusiones) vive en `services/api/pyproject.toml`.
      - name: ruff
        run: uvx ruff@0.15.5 check --output-format=github .

      # `-m "not network"` excluye los tests que golpean Planetary Computer y
      # WRI de verdad: son la suite de aceptación, no la de CI. Correrlos acá
      # haría que un corte de un servicio externo pusiera el repo en rojo.
      - name: pytest (subset offline)
        run: uv run pytest -m "not network"

  # Docker — build de las dos imágenes, sin push
  docker:
    name: Docker · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Dos imágenes con contextos y Dockerfiles distintos que fallan por
    # motivos distintos (una por resolución del workspace pnpm, la otra por
    # wheels de GDAL), así el PR muestra cuál se rompió sin abrir el log. No
    # hay matriz de plataformas: arm64 por emulación cuesta minutos por PR y
    # no cubre nada que el despliegue real no cubra.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: api
            context: ./services/api
            dockerfile: ./services/api/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # BuildKit de verdad: hace falta para `--mount=type=cache` (pnpm store,
      # caché de uv) y para el cacheo entre runs con GitHub Actions cache.
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Build y nada más: este repo no publica imágenes desde CI. El
          # despliegue es autoalojado y construye en el servidor con
          # `docker compose up --build`.
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Compose — que el orquestador sea válido. Barato (segundos) y atrapa la
  # clase de error más molesta: una variable mal escrita, un anchor YAML roto,
  # un `depends_on` a un servicio que no existe. No levanta nada.
  compose:
    name: Compose · config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # `env_file: .env` es obligatorio en compose.yaml; en CI no hay `.env`
      # (ni debe haberlo), así que se sintetiza uno con los valores del
      # ejemplo — lo mismo que hace una persona al desplegar por primera vez.
      # `docker compose config` solo valida sintaxis e interpolación, así que
      # las variables vacías de `.env.example` alcanzan.
      - name: Preparar .env de validación
        run: cp .env.example .env

      - name: Validar producción (solo compose.yaml)
        run: docker compose -f compose.yaml config --quiet

      - name: Validar desarrollo (compose.yaml + override)
        run: docker compose config --quiet
